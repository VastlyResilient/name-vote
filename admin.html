<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin — Name Vote</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,'SF Pro Text','Helvetica Neue',Arial,sans-serif;color:#1a1a1a;background:#fafbfc;min-height:100vh}
.wrap{max-width:960px;margin:0 auto;padding:48px 24px 80px}
h1{font-size:28px;font-weight:700}
.sub{color:#6b7280;font-size:13.5px;margin:8px 0 28px}
#login{max-width:400px;margin:70px auto;background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:36px}
#login h2{font-size:20px;margin-bottom:16px}
input{width:100%;padding:12px 14px;border:1.5px solid #e5e7eb;border-radius:10px;font-size:14px;margin-bottom:14px;font-family:inherit}
input:focus{outline:none;border-color:#2563eb}
.btn{width:100%;padding:12px;background:#1a1a1a;color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer}
.btn:hover{background:#000}
table{width:100%;border-collapse:collapse;background:#fff;border:1px solid #e5e7eb;border-radius:12px;overflow:hidden;font-size:12.5px}
th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.7px;color:#6b7280;padding:10px 12px;border-bottom:2px solid #1a1a1a}
td{padding:9px 12px;border-bottom:1px solid #eceef0}
.err{color:#b91c1c;font-size:13px;margin-top:8px}
.sum{display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.chip{background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:10px 16px;font-size:13px}
.chip b{font-size:18px;display:block}
a{color:#2563eb;font-size:13px}
</style></head><body>
<div id="login"><h2>Admin sign in</h2>
<input id="key" type="password" placeholder="Admin key">
<button class="btn" onclick="login()">Sign in</button>
<div class="err" id="lerr"></div></div>
<div id="panel" class="wrap" style="display:none">
<h1>Vote Admin</h1>
<div class="sub">Raw ballot log · <a href="results.html">Public results</a> · <a href="#" onclick="localStorage.removeItem('nv_admin');location.reload();return false">Sign out</a></div>
<div class="sum" id="sum"></div>
<table id="tbl"></table>
</div>
<script src="data.js"></script>
<script>
let key=localStorage.getItem('nv_admin');
if(key){document.getElementById('login').style.display='none';load();}
function login(){const k=document.getElementById('key').value.trim();if(!k)return;
 key=k;localStorage.setItem('nv_admin',k);document.getElementById('login').style.display='none';load();}
function load(){
 document.getElementById('panel').style.display='block';
 fetch(API_URL+'?action=admin&key='+encodeURIComponent(key)).then(r=>r.json()).then(d=>{
   if(!d.ok){localStorage.removeItem('nv_admin');document.getElementById('panel').style.display='none';
     document.getElementById('login').style.display='block';
     document.getElementById('lerr').textContent=d.error||'Wrong key';return}
   document.getElementById('sum').innerHTML=
     `<div class="chip"><b>${d.voterCount}</b>voters</div><div class="chip"><b>${d.totalRatings}</b>ratings</div>`+
     `<div class="chip" style="flex:1;min-width:200px"><b>${d.topName||'—'}</b>current leader</div>`;
   const t=document.getElementById('tbl');
   t.innerHTML='<tr><th>Voter</th><th>Name</th><th>Rating</th><th>Time</th></tr>'+
     d.rows.map(r=>`<tr><td>${r.voter}</td><td>${r.name}</td><td>${'★'.repeat(r.rating)}</td><td>${new Date(r.ts).toLocaleString()}</td></tr>`).join('');
 });
}
</script></body></html>
