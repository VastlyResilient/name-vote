<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Live Results — Name Vote</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,'SF Pro Text','Helvetica Neue',Arial,sans-serif;color:#1a1a1a;background:#fafbfc;min-height:100vh}
.wrap{max-width:760px;margin:0 auto;padding:48px 24px 80px}
h1{font-size:28px;font-weight:700}
.sub{color:#6b7280;font-size:13.5px;margin:8px 0 32px}
.row{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:14px 18px;margin-bottom:10px;display:flex;align-items:center;gap:14px}
.rank{font-size:16px;font-weight:700;color:#9ca3af;width:28px}
.nm{font-size:16px;font-weight:700;width:130px}
.bar{flex:1;height:10px;background:#f0f1f3;border-radius:99px;overflow:hidden}
.bar>div{height:100%;background:#f59e0b;border-radius:99px}
.avg{font-size:15px;font-weight:700;width:52px;text-align:right}
.ct{font-size:12px;color:#9ca3af;width:70px;text-align:right}
.err{color:#b91c1c;font-size:14px;padding:20px;background:#fef2f2;border-radius:10px}
a{color:#2563eb;font-size:13px}
</style></head><body><div class="wrap">
<h1>Live Results</h1>
<div class="sub">Average star rating per name · <span id="voters"></span> · <a href="index.html">← Vote</a></div>
<div id="list">Loading…</div>
</div>
<script src="data.js"></script>
<script>
fetch(API_URL+'?action=results').then(r=>r.json()).then(d=>{
  const list=document.getElementById('list');
  if(!d.ok){list.innerHTML='<div class="err">'+ (d.error||'Failed to load results') +'</div>';return}
  document.getElementById('voters').textContent=d.voterCount+' voter'+(d.voterCount==1?'':'s');
  const rows=d.scores.map(s=>{
    const meta=NAMES.find(x=>x.id===s.id)||{n:s.id};
    return {n:meta.n,avg:s.avg,count:s.count};
  }).sort((a,b)=>b.avg-a.avg);
  list.innerHTML=rows.map((r,i)=>`<div class="row"><span class="rank">#${i+1}</span><span class="nm">${r.n}</span>
    <div class="bar"><div style="width:${(r.avg/5*100).toFixed(0)}%"></div></div>
    <span class="avg">${r.avg?r.avg.toFixed(1):'—'}</span><span class="ct">${r.count} vote${r.count==1?'':'s'}</span></div>`).join('');
}).catch(e=>{document.getElementById('list').innerHTML='<div class="err">Could not load results.</div>'});
</script></body></html>
