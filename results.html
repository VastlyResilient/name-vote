<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Live Results — Name Vote</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:'Geist',sans-serif;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;background:#000;color:#fff}
@keyframes fadeSlideUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
.a2{animation:fadeSlideUp .8s ease .2s both}.a4{animation:fadeSlideUp .8s ease .4s both}
.a6{animation:fadeSlideUp .8s ease .7s both}.a8{animation:fadeSlideUp .8s ease .9s both}
.vbg{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;object-position:70% center}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55)}
nav{position:relative;z-index:30;display:flex;justify-content:space-between;align-items:center;padding:20px 24px}
@media(min-width:768px){nav{padding:20px 48px}}
.logo{font-size:18px;font-weight:600;letter-spacing:-.02em}
.navlinks{display:none;gap:28px;margin-left:40px}
@media(min-width:768px){.navlinks{display:flex}}
.navlinks a{font-size:14px;color:rgba(255,255,255,.8);text-decoration:none}
.navlinks a:hover{color:#fff}
.btn-w{display:inline-flex;align-items:center;gap:8px;border-radius:10px;background:#fff;padding:10px 22px;font-size:14px;font-weight:500;color:#000;border:none;cursor:pointer;transition:transform .2s;font-family:'Geist',sans-serif;text-decoration:none}
.btn-w:hover{transform:scale(1.05)}
.badge{display:inline-block;font-size:12px;color:rgba(255,255,255,.9);border:1px solid rgba(255,255,255,.25);border-radius:99px;padding:5px 14px;margin-bottom:18px}
h1{font-size:32px;font-weight:500;line-height:1.1;letter-spacing:-.03em}
@media(min-width:640px){h1{font-size:44px}}
.muted{color:rgba(255,255,255,.6)}
.card{background:rgba(10,10,12,.55);border:1px solid rgba(255,255,255,.14);border-radius:16px;backdrop-filter:blur(24px) saturate(1.1);-webkit-backdrop-filter:blur(24px) saturate(1.1)}
input{width:100%;padding:13px 16px;border-radius:12px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.07);color:#fff;font-size:15px;font-family:'Geist',sans-serif;margin-bottom:14px}
input::placeholder{color:rgba(255,255,255,.4)}
input:focus{outline:none;border-color:rgba(255,255,255,.6)}
.bar{height:18px;background:rgba(255,255,255,.08);border-radius:99px;overflow:hidden;flex:1;display:flex}
.bar>div{height:100%;transition:width .6s ease}
.b1{background:#fbbf24}.b2{background:#38bdf8}.b3{background:#34d399}.b4{background:#f472b6}.b5{background:#a78bfa}.b6{background:#fb923c}
.vdots{display:flex;gap:4px;min-width:20px;justify-content:flex-end}
.vdots i{width:9px;height:9px;border-radius:99px;display:inline-block}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.8px;color:rgba(255,255,255,.5);padding:10px 12px;border-bottom:1px solid rgba(255,255,255,.3)}
td{padding:10px 12px;border-bottom:1px solid rgba(255,255,255,.08);vertical-align:top}
a{color:#93c5fd}
</style></head><body>
<video class="vbg" autoplay muted loop playsinline src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260622_204221_5339e40b-e73d-4ab0-9c65-79c18c66fd50.mp4"></video>
<div class="scrim"></div>
<nav>
  <div style="display:flex;align-items:center"><span class="logo">Name&nbsp;Vote</span>
    <div class="navlinks"><a href="index.html">Vote</a></div>
  </div>
  <a class="btn-w" href="admin.html">Admin</a>
</nav>

<div style="position:relative;z-index:10;max-width:680px;margin:0 auto;padding:32px 24px 100px">
  <div id="blind" class="card" style="text-align:center;padding:48px 32px;margin-top:40px">
    <span class="badge">Blind vote in progress</span>
    <h1 style="margin:16px 0 12px">Results are hidden<br>until voting closes.</h1>
    <p class="muted" style="font-size:14px;line-height:1.7;max-width:380px;margin:0 auto">So nobody anchors on anyone else's picks — vote on what fits, not momentum.</p>
  </div>
  <div id="gated" style="display:none">
    <span class="badge a2">Live standings</span>
    <h1 class="a4" style="margin-bottom:10px">Results.</h1>
    <p class="muted a6" style="font-size:14px;margin-bottom:28px"><span id="voters"></span> · scores out of 5</p>

    <h2 style="font-size:16px;font-weight:600;margin-bottom:14px">Average across all voters</h2>
    <div id="board" style="margin-bottom:44px"></div>

    <h2 style="font-size:16px;font-weight:600;margin-bottom:14px">What each person voted</h2>
    <div id="perVoter"></div>
  </div>
</div>
<script src="data.js?v=5"></script>
<script>
let key=localStorage.getItem('nv_admin');
if(!key){
  key=prompt('Results are hidden while voting is open. Admin key to preview:');
  if(!key) throw 0;
}
fetch('https://name-vote-api-production.up.railway.app/?action=admin&key='+encodeURIComponent(key))
.then(r=>r.json()).then(d=>{
  if(!d.ok){document.getElementById('blind').innerHTML='<p style="color:#f87171;padding:20px">Invalid admin key.</p>';return}
  document.getElementById('gated').style.display='block';
  fetch('https://name-vote-api-production.up.railway.app/?action=results').then(r=>r.json()).then(render);
}).catch(()=>{});
const BC=['#fbbf24','#38bdf8','#34d399','#f472b6','#a78bfa','#fb923c'];
function nameOf(id){const m=NAMES.find(x=>x.id===id);return m?m.n:id;}
function stars(n){const f='★'.repeat(n),e='☆'.repeat(5-n);return f+'<span style="opacity:.3">'+e+'</span>';}
function render(d){
  const pv=d.perVoter||{};
  const voters=Object.keys(pv);
  document.getElementById('voters').textContent=d.voterCount+' voter'+(d.voterCount==1?'':'s')+' so far';
  if(!voters.length){document.getElementById('board').innerHTML='<p class="muted">No votes yet.</p>';return}

  // ---- overall board: avg + each voter's score in a row ----
  const rows=NAMES.map(x=>{
    const got=voters.map((v,vi)=>({vi,r:pv[v].ratings[x.id]})).filter(p=>p.r);
    if(!got.length)return null;
    return {id:x.id,n:x.n,avg:got.reduce((a,p)=>a+p.r,0)/got.length,got};
  }).filter(Boolean).sort((a,b)=>b.avg-a.avg);
  const maxAvg=5;
  document.getElementById('board').innerHTML=rows.map((r,i)=>`
    <div class="card" style="padding:14px 18px;margin-bottom:10px">
      <div style="display:flex;align-items:center;gap:14px">
        <span style="font-weight:600;color:rgba(255,255,255,.35);width:22px">${i+1}</span>
        <span style="font-weight:600;width:110px">${r.n}</span>
        <div style="flex:1;height:8px;background:rgba(255,255,255,.08);border-radius:99px;overflow:hidden">
          <div style="height:100%;width:${(r.avg/maxAvg*100).toFixed(0)}%;background:#fbbf24;border-radius:99px"></div>
        </div>
        <b style="width:38px;text-align:right">${r.avg.toFixed(1)}</b>
      </div>
      <div style="margin:8px 0 0 36px;font-size:12.5px;color:rgba(255,255,255,.65)">
        ${r.got.map(p=>`<span style="margin-right:16px;white-space:nowrap"><i style="width:8px;height:8px;border-radius:99px;background:${BC[p.vi%6]};display:inline-block;margin-right:5px"></i>${voters[p.vi]}: <b style="color:#fff">${p.r}</b></span>`).join('')}
      </div>
    </div>`).join('');

  // ---- per voter sections ----
  document.getElementById('perVoter').innerHTML=voters.map((v,vi)=>{
    const entries=Object.entries(pv[v].ratings).sort((a,b)=>b[1]-a[1]);
    const when=pv[v].latest?new Date(pv[v].latest).toLocaleString():'';
    return `<div class="card" style="padding:20px 22px;margin-bottom:16px">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:4px">
        <i style="width:10px;height:10px;border-radius:99px;background:${BC[vi%6]};display:inline-block"></i>
        <b style="font-size:16px">${v}</b>
        <span class="muted" style="font-size:12px;margin-left:auto">${entries.length} of ${NAMES.length} rated · ${when}</span>
      </div>
      <table style="width:100%;border-collapse:collapse;margin-top:8px">
        ${entries.map(([id,r])=>`<tr>
          <td style="padding:7px 0;font-size:14px;width:130px">${nameOf(id)}</td>
          <td style="padding:7px 0;color:#fbbf24;font-size:13px">${stars(r)}</td>
          <td style="padding:7px 0;text-align:right;font-size:13px;color:rgba(255,255,255,.6)">${r} / 5</td>
        </tr>`).join('')}
      </table>
    </div>`;
  }).join('');
}
</script>
<script>
let key=localStorage.getItem('nv_admin');
if(!key){
  key=prompt('Results are hidden while voting is open. Admin key to preview:');
  if(!key) throw 0;
}
fetch('https://name-vote-api-production.up.railway.app/?action=admin&key='+encodeURIComponent(key))
.then(r=>r.json()).then(d=>{
  if(!d.ok){document.getElementById('blind').innerHTML='<p style="color:#f87171;padding:20px">Invalid admin key.</p>';return}
  document.getElementById('gated').style.display='block';
  fetch('https://name-vote-api-production.up.railway.app/?action=results').then(r=>r.json()).then(render);
}).catch(()=>{});
const BC=['b1','b2','b3','b4','b5','b6'];
const BC_HEX=['#fbbf24','#38bdf8','#34d399','#f472b6','#a78bfa','#fb923c'];
function render(d){
  if(!d||!d.scores){document.getElementById('list').innerHTML='<p class="muted">No votes yet.</p>';return}
  document.getElementById('voters').textContent=d.voterCount+' voter'+(d.voterCount==1?'':'s');
  const pv=d.perVoter||{};
  const voters=Object.keys(pv);
  // legend
  if(voters.length){
    document.getElementById('legend').innerHTML=voters.map((v,i)=>
      `<span style="display:inline-flex;align-items:center;gap:6px;font-size:12px;color:rgba(255,255,255,.7);margin-right:14px"><i style="width:9px;height:9px;border-radius:99px;background:${BC_HEX[i%6]};display:inline-block"></i>${v}</span>`).join('');
  }
  const allIds=NAMES.map(x=>x.id);
  const rows=allIds.map(id=>{
    const meta=NAMES.find(x=>x.id===id);
    const parts=voters.map((v,vi)=>({vi,r:pv[v].ratings[id]})).filter(p=>p.r);
    const avg=parts.length?parts.reduce((a,p)=>a+p.r,0)/parts.length:0;
    return {id,n:meta?meta.n:id,avg,parts};
  }).filter(r=>r.parts.length).sort((a,b)=>b.avg-a.avg);
  document.getElementById('list').innerHTML=rows.map((r,i)=>`<div class="card" style="padding:14px 20px;margin-bottom:10px">
    <div style="display:flex;align-items:center;gap:16px">
    <span style="font-weight:600;color:rgba(255,255,255,.35);width:28px;font-size:15px">${i+1}</span>
    <span style="font-weight:600;font-size:15px;width:120px">${r.n}</span>
    <div class="bar">${r.parts.map(p=>`<div class="${BC[p.vi%6]}" style="width:${(p.r/5*100).toFixed(1)}%" title="${voters[p.vi]}: ${p.r}★"></div>`).join('')}</div>
    <span style="font-weight:600;width:46px;text-align:right;font-size:15px">${r.avg.toFixed(1)}</span>
    <span class="vdots">${r.parts.map(p=>`<i style="background:${BC_HEX[p.vi%6]}" title="${voters[p.vi]}: ${p.r}★"></i>`).join('')}</span>
    </div>
    <div style="margin-top:8px;padding-left:44px;font-size:12px;color:rgba(255,255,255,.55)">${r.parts.map(p=>`<span style="margin-right:14px"><i style="width:8px;height:8px;border-radius:99px;background:${BC_HEX[p.vi%6]};display:inline-block;margin-right:5px"></i>${voters[p.vi]} <b style="color:#fff">${p.r}★</b></span>`).join('')}</div>
  </div>`).join('');
}
</script></body></html>
